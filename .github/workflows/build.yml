name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-core:
    name: Tests du moteur PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev fonts-liberation libtesseract-dev libleptonica-dev
      - run: node scripts/fetch-pdfium.mjs linux-x64
      - run: node scripts/fetch-tessdata.mjs fra eng
      # Tests link the system Tesseract (faster); the installers compile it in.
      - run: cargo test -p kb-core --features system-tesseract
        env:
          PDFIUM_DIR: ${{ github.workspace }}/src-tauri/pdfium
      - run: npm ci && npm run build

  app:
    name: App ${{ matrix.label }}
    needs: test-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            pdfium: mac-arm64
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          # Built on an Intel runner: Tesseract is compiled natively.
          - label: macOS (Intel)
            os: macos-15-intel
            pdfium: mac-x64
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - label: Windows
            os: windows-latest
            pdfium: win-x64
            args: ''
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      # Tesseract + Leptonica, compiled once then reused (tesseract-rs cache folder).
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Application Support/tesseract-rs
            ~/AppData/Roaming/tesseract-rs
          key: tesseract-rs-0.4-${{ matrix.pdfium }}
      - run: node scripts/fetch-pdfium.mjs ${{ matrix.pdfium }}
      - run: node scripts/fetch-tessdata.mjs
      - run: npm ci
      # The macOS DMG step (hdiutil) fails now and then with "resource busy":
      # a second run reuses the compiled app and only repackages.
      - shell: bash
        run: npx tauri build ${{ matrix.args }} || { sleep 20; npx tauri build ${{ matrix.args }}; }
      - name: Installateurs
        uses: actions/upload-artifact@v4
        with:
          name: KB-PDF-Reader-${{ matrix.pdfium }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
